name: Docker Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Publishing is disabled — we build and deploy from kegberry (the Pi) for now.
# CI only validates that the image builds. To re-enable publishing to GHCR,
# uncomment the "Login to GitHub Container Registry" and "Publish" steps below
# (the `packages: write` permission is already set for that).
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        id: prepare
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG%-*}" >> "$GITHUB_OUTPUT"
          else
            echo "version=snapshot" >> "$GITHUB_OUTPUT"
          fi
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login is only needed for publishing, which is disabled (see note above).
      # Docker Hub publishing is also disabled — we publish to GHCR, not Docker Hub.
      # - name: Login to DockerHub Registry
      #   run: echo ${{ secrets.DOCKER_HUB_PASSWORD }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
      # - name: Login to GitHub Container Registry
      #   if: github.ref == 'refs/heads/master'
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker buildx build \
            --output "type=image,push=false" \
            --platform linux/amd64,linux/arm/v7 \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --build-arg "BUILD_DATE=${{ steps.prepare.outputs.build_date }}" \
            --build-arg "GIT_SHORT_SHA=${GITHUB_SHA::8}" \
            --build-arg "VERSION=${{ steps.prepare.outputs.version }}" \
            --tag "ghcr.io/flangelo/kegbot-pycore:${{ steps.prepare.outputs.version }}" \
            --tag "ghcr.io/flangelo/kegbot-pycore:latest" \
            .

      # Publishing disabled — build and deploy from kegberry (the Pi) for now.
      # Uncomment this step (and the GHCR login above) to push to ghcr.io.
      # - name: Publish
      #   if: success() && github.ref == 'refs/heads/master'
      #   run: |
      #     docker buildx build \
      #       --output "type=image,push=true" \
      #       --platform linux/amd64,linux/arm/v7 \
      #       --cache-from=type=gha \
      #       --build-arg "BUILD_DATE=${{ steps.prepare.outputs.build_date }}" \
      #       --build-arg "GIT_SHORT_SHA=${GITHUB_SHA::8}" \
      #       --build-arg "VERSION=${{ steps.prepare.outputs.version }}" \
      #       --tag "ghcr.io/flangelo/kegbot-pycore:${{ steps.prepare.outputs.version }}" \
      #       --tag "ghcr.io/flangelo/kegbot-pycore:latest" \
      #       .
